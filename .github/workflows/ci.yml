name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # NimbleBrain changes a mirrored file without touching this repo, so drift is
  # checked daily as well as on every change here.
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
  BUN_VERSION: "1.4.3"

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test

  sync:
    name: In step with NimbleBrain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: NimbleBrainInc/nimblebrain
          ref: main
          path: nimblebrain
          sparse-checkout: |
            src
            test
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun scripts/sync.ts nimblebrain --check
